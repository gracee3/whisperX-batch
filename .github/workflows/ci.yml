name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run offline behavior tests
        run: make test PYTHON=python

      - name: Check patch whitespace
        run: git diff --check

      - name: Confirm exceptional resources were not used
        run: |
          echo "Docker: not run"
          echo "GPU: not accessed"
          echo "Models/datasets/audio: not accessed"
          echo "Networked benchmark: not run"
